<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 สุ่มที่นั่งนักเรียน</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        text-align: center;
        margin: 0;
        padding: 30px 15px;
    }
    .box {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,.12);
    }
    h1 { margin-top: 0; }
    textarea {
        width: 100%;
        height: 220px;
        padding: 15px;
        font-size: 18px;
        border: 2px solid #ccc;
        border-radius: 12px;
        resize: vertical;
    }
    button {
        width: 100%;
        margin-top: 15px;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        font-size: 20px;
        cursor: pointer;
    }
    button:hover { opacity: .85; }
    #message {
        margin: 18px 0 8px;
        font-size: 20px;
        font-weight: bold;
    }
    #result {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
        margin-top: 15px;
    }
    .seat {
        padding: 18px 8px;
        background: #f8f8f8;
        border: 2px solid #555;
        border-radius: 12px;
        font-size: 17px;
    }
    .number {
        font-size: 13px;
        color: #666;
    }
</style>
</head>
<body>

<div class="box">
    <h1>🎲 สุ่มที่นั่งนักเรียน</h1>

    <p>ใส่รายชื่อนักเรียน <b>ทีละบรรทัด</b></p>

    <textarea id="names" placeholder="เช่น
นนท์
บีม
เจมส์
ต้น
ฟ้า
ก้อง"></textarea>

    <button onclick="randomize()">🎲 สุ่มที่นั่ง</button>

    <div id="message"></div>
    <div id="result"></div>
</div>

<script>
function randomize() {
    const text = document.getElementById("names").value;

    let names = text
        .split(/\r?\n/)
        .map(name => name.trim())
        .filter(name => name !== "");

    if (names.length === 0) {
        document.getElementById("message").textContent =
            "⚠️ กรุณาใส่รายชื่อนักเรียนก่อน";
        document.getElementById("result").innerHTML = "";
        return;
    }

    // สุ่มรายชื่อ
    for (let i = names.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [names[i], names[j]] = [names[j], names[i]];
    }

    const result = document.getElementById("result");
    result.innerHTML = "";

    names.forEach((name, index) => {
        const seat = document.createElement("div");
        seat.className = "seat";
        seat.innerHTML =
            `<div class="number">ที่นั่ง ${index + 1}</div>
             <strong>${escapeHtml(name)}</strong>`;
        result.appendChild(seat);
    });

    document.getElementById("message").textContent =
        `🎉 สุ่มเรียบร้อยแล้ว! ${names.length} คน`;
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
